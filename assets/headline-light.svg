<svg xmlns="http://www.w3.org/2000/svg" width="680" height="44" viewBox="0 0 680 44" role="img" aria-label="Building Saizen, an anime streaming app for iOS. Shipping Next.js and TypeScript on the web. Automating Linux with Python and Bash.">
<style>.t{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
font-size:18px;font-weight:500;fill:#4C3BCF}
.l{opacity:0;animation:cycle 12.0s infinite}
@keyframes cycle{
0%{opacity:0;transform:translateY(7px)}
5.00%{opacity:1;transform:translateY(0)}
33.33%{opacity:1;transform:translateY(0)}
35.83%{opacity:0;transform:translateY(-7px)}
100%{opacity:0;transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){
.l{animation:none;opacity:0}
.l:first-of-type{opacity:1}}</style>
<g class="l" style="animation-delay:0.00s"><text class="t" x="0" y="28">Building Saizen, an anime streaming app for iOS</text></g>
<g class="l" style="animation-delay:4.00s"><text class="t" x="0" y="28">Shipping Next.js and TypeScript on the web</text></g>
<g class="l" style="animation-delay:8.00s"><text class="t" x="0" y="28">Automating Linux with Python and Bash</text></g>
</svg>