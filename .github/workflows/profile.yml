name: Render profile

on:
  schedule:
    # Twice a day keeps the skyline roughly day/night accurate without
    # an hourly workflow run. Metrics refresh on the same cadence.
    - cron: "0 0,12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

concurrency:
  group: profile
  cancel-in-progress: true

env:
  METRICS_MAX_AGE_HOURS: 12

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Reuse the cached metrics if they are still fresh
        id: cache
        run: |
          mkdir -p out/assets
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/scene/metrics.json"
          fresh=false
          if curl -fsSL "$url" -o out/metrics.json; then
            age=$(python3 scripts/cache_age.py out/metrics.json)
            echo "cached metrics are ${age}h old (max ${METRICS_MAX_AGE_HOURS}h)"
            if [ "$age" -lt "$METRICS_MAX_AGE_HOURS" ]; then
              fresh=true
            fi
          else
            echo "no cached metrics found"
          fi
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
          echo "reusing cache: $fresh"

      - name: Pull fresh metrics from the API
        if: steps.cache.outputs.fresh != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/fetch_metrics.py out/metrics.json

      - name: Render the profile for the current time in Asia/Kolkata
        run: METRICS=out/metrics.json python3 scripts/render_profile.py assets/profile.svg

      - name: Commit the rendered card and README on main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile.svg README.md
          if git diff --staged --quiet; then
            echo "rendered assets unchanged"
          else
            git commit -m "Render profile at $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M %Z')"
            git push
          fi

      - name: Publish metrics cache to the scene branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/assets
          cp assets/profile.svg out/assets/profile.svg
          cd out
          git init -q
          git checkout -qb scene
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Render profile at $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M %Z')"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" scene
