name: Render profile

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

concurrency:
  group: profile
  cancel-in-progress: true

env:
  METRICS_MAX_AGE_HOURS: 6

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Reuse the cached metrics if they are still fresh
        id: cache
        run: |
          mkdir -p out/assets
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/scene/metrics.json"
          if curl -fsSL "$url" -o out/metrics.json; then
            age=$(python3 - <<'EOF'
          import json, datetime
          t = json.load(open("out/metrics.json"))["generated_at"]
          d = datetime.datetime.fromisoformat(t)
          print(int((datetime.datetime.now(datetime.timezone.utc) - d).total_seconds() // 3600))
          EOF
            )
            echo "cached metrics are ${age}h old"
            [ "$age" -lt "$METRICS_MAX_AGE_HOURS" ] && echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "no cached metrics"
          fi

      - name: Pull fresh metrics from the API
        if: steps.cache.outputs.fresh != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/fetch_metrics.py out/metrics.json

      - name: Render the profile for the current time in Asia/Kolkata
        run: METRICS=out/metrics.json python3 scripts/render_profile.py out/assets/profile.svg

      - name: Publish to the scene branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q
          git checkout -qb scene
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Render profile at $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M %Z')"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" scene
